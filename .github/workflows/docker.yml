name: Docker

# Two things publish an image: a version tag (v1.2.3 -> 1.2.3, 1.2, 1, latest) and a
# push to main (-> edge). `edge` exists so the compose examples in deploy/ have
# something to pull that tracks the branch, without a release having to be cut first.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  # Pushing to GitHub's container registry is a package write; the default GITHUB_TOKEN
  # carries it once it is requested here.
  packages: write

jobs:
  image:
    name: ghcr.io/${{ github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is built by emulation on an amd64 runner. The build is a Go
      # cross-compile (CGO_ENABLED=0 in the Dockerfile), so QEMU only has to run the
      # handful of Alpine commands in the runtime stage -- not a compiler.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and OCI metadata in one place. The annotations matter as much as the tags:
      # org.opencontainers.image.source is what links the package to this repository on
      # GitHub (and is what makes the package page show a README at all), and .revision
      # is what lets someone holding only a digest find the commit it was built from.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Annotate both the per-platform manifests and the multi-arch index. The
          # default is manifest only, which on a multi-platform build annotates images
          # nobody pulls directly and leaves the index -- the thing a `docker pull`
          # resolves -- bare.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=long
          # `latest` follows the newest semver tag (metadata-action's latest=auto
          # default), so a push to main updates `edge` and leaves `latest` alone.
          labels: |
            org.opencontainers.image.title=shardkv
            org.opencontainers.image.description=Concurrent, sharded, Redis-wire-compatible in-memory data-structure server, with no third-party dependencies
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.vendor=Black-third
          annotations: |
            org.opencontainers.image.title=shardkv
            org.opencontainers.image.description=Concurrent, sharded, Redis-wire-compatible in-memory data-structure server, with no third-party dependencies
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # An SBOM and a full provenance attestation, both attached to the pushed
          # index: `docker buildx imagetools inspect` and `cosign verify-attestation`
          # can then answer "what is in this image and where did it come from" without
          # anyone having to trust the answer in a README.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

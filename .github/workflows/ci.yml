name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The full gate, across the Go versions the module is expected to build on: the
  # floor declared in go.mod, and whatever is current. Listing anything below the
  # go.mod floor would prove nothing -- the toolchain would just fetch a newer one --
  # so the matrix is exactly "the oldest we claim to support, and the newest there is".
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.4', 'stable']
    name: test (go ${{ matrix.go-version }})
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          # false: this module has no dependencies, so there is no go.sum -- the file
          # setup-go derives its cache key from. With cache: true every job logged
          # "Restore cache failed: Dependencies file is not found" and cached nothing,
          # which is a warning on every job for a cache that cannot exist. Zero
          # third-party dependencies is the point of the project, so this stays off.
          cache: false

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -v so a failure names itself. The output is kept rather than streamed alone,
      # because the step that follows turns it into the run summary: downloading a job
      # log needs admin rights on the repository, so a contributor without them -- or
      # anyone reading the run from a phone -- otherwise sees only "Process completed
      # with exit code 1" and has to reproduce the failure before they can read it.
      # This suite is concurrent and timing-sensitive; the failures worth catching are
      # exactly the ones that do not reproduce on demand.
      - name: Test (race detector)
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... 2>&1 | tee /tmp/test-race.log

      # The blocking commands and the protocol tests are the timing-sensitive part of
      # the suite: real concurrent TCP clients, real wakeups, real timeouts. A single
      # green run does not distinguish "correct" from "got lucky", and an intermittent
      # failure discovered by a contributor weeks later is far more expensive than the
      # half-minute this costs.
      - name: Repeat the concurrency-sensitive tests
        run: |
          set -o pipefail
          go test -race -count=3 -v \
            -run 'TestBlocking|TestClientUnblock|TestRESP|TestDatabase|TestSwapDB|TestSelectFrames' \
            ./internal/server 2>&1 | tee /tmp/test-repeat.log

      # What failed, in the run's Summary tab, readable by anyone who can see the run.
      # A data race is extracted separately and first: its report is the whole diagnosis
      # and it is printed by the runtime rather than by the test, so it does not
      # necessarily sit under any "--- FAIL" line.
      - name: Report what failed
        if: failure()
        run: |
          {
            echo "## Test failures (go ${{ matrix.go-version }})"
            for log in /tmp/test-race.log /tmp/test-repeat.log; do
              [ -f "$log" ] || continue
              if grep -q "WARNING: DATA RACE" "$log"; then
                echo "### Data race in $(basename "$log")"
                echo '```'
                awk '/WARNING: DATA RACE/{p=1} p&&n++<120' "$log"
                echo '```'
              fi
              if grep -qE '^\s*--- FAIL' "$log"; then
                echo "### Failing tests in $(basename "$log")"
                echo '```'
                grep -E '^\s*--- FAIL' "$log" | sed 's/^[[:space:]]*//'
                echo '```'
                echo "<details><summary>output</summary>"
                echo
                echo '```'
                # -B, not -A: with -v, a test's own log lines are printed *before* its
                # "--- FAIL" marker, so trailing context shows the next test rather than
                # the reason this one failed. That is where t.Errorf/t.Fatalf output is.
                grep -B 40 -A 2 -E '^\s*--- FAIL' "$log" | head -400
                echo '```'
                echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fuzz the RESP parser (short)
        run: go test -run=^$ -fuzz=FuzzReadCommand -fuzztime=20s ./internal/resp

  # The Go tests prove the server does what this project believes Redis does. They
  # cannot prove that a real client library agrees, because they are written against
  # the same understanding as the server. This job drives the server with the clients
  # applications actually use -- redis-py, ioredis, node-redis, go-redis, each in its
  # own container -- and runs every check a second time against a real redis:7-alpine
  # under identical code. The finding is the *difference* between those two columns:
  # a check that fails against both is a quirk of the library or a bug in the check,
  # and only one that passes against Redis and fails here is an incompatibility.
  #
  # It is a job of its own because it needs Docker and takes minutes rather than
  # seconds, and it does not vary with the Go version, so running it inside the
  # matrix would multiply the cost for the same answer.
  compat:
    runs-on: ubuntu-latest
    name: client-library compatibility
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      # The client images are the slow part (npm install, go mod download, pip install), so
      # they are cached and reloaded rather than rebuilt.
      #
      # The key hashes every file in each suite directory, not just the Dockerfile. That is
      # the whole correctness of this cache: each Dockerfile COPYs its suite's source in
      # (`main.go`, `compat.mjs`, `compat.py`), so the image *contains* the checks. Keying on
      # the Dockerfile alone -- which is what this did -- meant editing a check without
      # touching its Dockerfile restored an image holding the previous version of that check
      # and ran it. CI would then be testing code that is not in the tree, disagree with a
      # local run, and report neither fact. Hashing the sources makes an edited check a cache
      # miss, which is what it has to be.
      #
      # run.sh is in the key too, because it names the base image tags that are cached
      # alongside the client images below -- changing REDIS_IMAGE has to miss.
      - name: Cache the client images
        uses: actions/cache@v5
        with:
          path: /tmp/compat-images
          key: compat-images-${{ hashFiles('test/compat/*/*', 'test/compat/run.sh') }}

      # A load that fails is reported, not swallowed. `|| true` is still there -- a missing
      # or corrupt tar must fall back to building the image, not fail the job -- but it used
      # to hide the fallback happening, and a silent fallback is indistinguishable from a
      # cache hit when you are trying to work out why a run behaved differently.
      - name: Load cached client images
        run: |
          shopt -s nullglob
          loaded=0 failed=0
          for tar in /tmp/compat-images/*.tar; do
            if docker load -i "$tar"; then
              loaded=$((loaded+1))
            else
              failed=$((failed+1))
              echo "::warning::could not load $tar; its image will be rebuilt"
            fi
          done
          echo "cached images loaded=$loaded failed=$failed"

      # Output kept so the step below can put it in the run summary. This job has failed
      # intermittently -- 4 of 10 recent runs, straddling a cache-key fix that was briefly
      # mistaken for a cure -- and each time it produced no artifact at all, because it dies
      # before writing test/compat/.results/. So the artifact upload cannot carry the
      # diagnosis, and a job log needs admin rights on the repository to download. Three
      # separate attempts to diagnose this from the outside failed for that reason.
      - name: Run the client-library suites
        run: |
          set -o pipefail
          ./test/compat/run.sh 2>&1 | tee /tmp/compat.log

      # The setup phase is what dies, so the tail is where the reason is. Docker state is
      # dumped beside it because the plausible causes are all there: an image that did not
      # load, a container that did not start, a registry pull that failed.
      - name: Report why the suites failed
        if: failure()
        run: |
          {
            echo "## client-library compatibility failed"
            echo
            echo "### last 120 lines"
            echo '```'
            tail -n 120 /tmp/compat.log 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo "### docker state"
            echo '```'
            docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' 2>&1 | head -40
            echo "--- images ---"
            docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' 2>&1 | head -30
            echo "--- networks ---"
            docker network ls --format '{{.Name}}' 2>&1 | head -20
            echo '```'
            echo "### results directory"
            echo '```'
            ls -la test/compat/.results/ 2>&1 | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the client images
        if: always()
        run: |
          mkdir -p /tmp/compat-images
          for suite in python ioredis noderedis goredis; do
            docker image inspect "skcompat-$suite" >/dev/null 2>&1 \
              && docker save -o "/tmp/compat-images/$suite.tar" "skcompat-$suite"
          done
          # The base images too, so a cache hit needs no registry at all. This job failed
          # in 4 of 10 runs by dying on the implicit pull of one of these before any check
          # had run; run.sh now retries a pull, and caching them means the retry is rarely
          # reached. Named by tag with the separator replaced, since a tar name cannot
          # carry a colon or a slash.
          for image in redis:7-alpine alpine:3.21; do
            docker image inspect "$image" >/dev/null 2>&1 \
              && docker save -o "/tmp/compat-images/base-$(echo "$image" | tr ':/' '--').tar" "$image"
          done

      # The matrix and every suite's raw log, so a failure can be diagnosed from
      # the run rather than reproduced first.
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compat-results
          path: test/compat/.results/
          retention-days: 14

  # golangci-lint is part of the gate the project holds itself to (make lint), so CI
  # has to run it: a linter that only runs when someone remembers is a linter whose
  # findings accumulate. It is a job of its own rather than a step in the matrix
  # because its result does not depend on the Go version, and running it twice would
  # only double the time to the same answer.
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: golangci-lint
        # v2 of the *linter* is the load-bearing part: `.golangci.yml` is a v2 config and
        # `make lint` installs `golangci-lint/v2`, while the action's v6 line only ever
        # installed golangci-lint v1, which cannot read that file. CI was therefore running a
        # different linter from the one the project holds itself to, and failing for a third
        # reason before it got far enough to notice. The action is on v9 because that is its
        # first Node 24 line; v8 was the last on Node 20, which GitHub now force-migrates.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # Cross-compilation only: it costs one compile per target and is what catches a
  # word-size or platform assumption (a 32-bit int truncating a millisecond deadline,
  # say) without needing hardware to run the tests on.
  #
  # linux/386 and linux/arm are the point of this job, not padding: they are the only
  # targets here where `int` is 32 bits wide, so they are the only ones that can catch
  # the assumption the comment above describes. Without them the job could not: the
  # matrix was amd64/arm64/darwin-arm64, all 64-bit, and `internal/store` had a
  # `const lim = 1 << 40` compared against an `int` that did not fit it -- the package
  # had not compiled for either 32-bit target for some time, and nothing reported it.
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: arm
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
